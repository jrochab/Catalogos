<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mis documentos</title>
<style>
:root{--bg:#f6f7f9;--surface:#fff;--text:#1d2330;--muted:#5d6678;--line:#dde1e8;--accent:#1f5eff}
@media (prefers-color-scheme:dark){:root{--bg:#12151c;--surface:#1b1f29;--text:#eef0f5;--muted:#9aa3b5;--line:#2c3240;--accent:#7ea2ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:28px 20px 8px;max-width:760px;margin:0 auto}
h1{margin:0;font-size:1.6rem}
header p{margin:4px 0 0;color:var(--muted)}
main{max-width:760px;margin:0 auto;padding:16px 20px 48px}
h2{font-size:1.05rem;margin:22px 0 10px;color:var(--muted)}
.item{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px;color:inherit;text-decoration:none}
.item:hover,.item:focus-visible{border-color:var(--accent);outline:none}
.item b{display:block}
.item small{color:var(--muted)}
.item span{color:var(--accent);font-weight:600;white-space:nowrap}
#viewer{display:none}
.bar{position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px}
.bar a{color:var(--accent);text-decoration:none;font-weight:600}
#pages{max-width:900px;margin:0 auto;padding:12px}
#pages canvas{display:block;width:100%;height:auto;margin:0 auto 12px;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.2)}
.bar button{font:inherit;font-weight:600;color:var(--accent);background:none;border:1px solid var(--line);border-radius:8px;padding:4px 10px;cursor:pointer}
#bookWrap{display:none;width:100%;max-width:1100px;margin:0 auto;height:calc(100vh - 120px);height:calc(100dvh - 120px)}
#book{width:100%;height:100%}
.page{background:#fff}
.page img{display:block;width:100%;height:100%}
#nav{display:none;align-items:center;justify-content:center;gap:18px;padding:8px}
#nav button{font:inherit;font-size:1.1rem;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 16px;cursor:pointer}
#nav span{color:var(--muted);min-width:70px;text-align:center}
#msg{text-align:center;color:var(--muted);padding:24px}
</style>
</head>
<body>

<div id="list">
  <header>
    <h1>Mis documentos</h1>
    <p>Toca uno para leerlo.</p>
  </header>
  <main id="items"></main>
</div>

<div id="viewer">
  <div class="bar">
    <a href="#" id="back">‹ Volver</a>
    <button id="mode" type="button">Ver seguido</button>
    <a id="dl" href="#" download>Descargar</a>
  </div>
  <div id="msg">Cargando…</div>
  <div id="bookWrap"><div id="book"></div></div>
  <div id="nav"><button id="prev" type="button" aria-label="Página anterior">‹</button><span id="count"></span><button id="next" type="button" aria-label="Página siguiente">›</button></div>
  <div id="pages"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
/* Repositorio de GitHub: usuario/nombre. La lista se genera sola
   con todos los PDF que haya en el repositorio. */
const REPO = "jrochab/Catalogos";
let DOCS = [];

const $ = id => document.getElementById(id);

const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const esc = t => t.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function parseName(name) {
  const base = name.replace(/\.pdf$/i, "").replace(/_/g, " ");
  const MN = "(enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|setiembre|octubre|noviembre|diciembre)";
  const SEP = "[-. \\/]";
  const monthNum = w => { w = w.toLowerCase(); return w === "setiembre" ? 9 : MESES.indexOf(w) + 1; };
  const rules = [
    // 19 de octubre de 2026 | 19 octubre 2026
    [new RegExp("(?<!\\d)(\\d{1,2})\\s*(?:de\\s+)?" + MN + "\\s*(?:de\\s+)?(\\d{4})(?!\\d)", "i"), m => [m[3], monthNum(m[2]), m[1]]],
    // octubre 2026 | octubre de 2026
    [new RegExp(MN + "\\s*(?:de\\s+|" + SEP + ")?\\s*(\\d{4})(?!\\d)", "i"), m => [m[2], monthNum(m[1]), 0]],
    // 2026 octubre | 2026-octubre
    [new RegExp("(?<!\\d)(\\d{4})\\s*" + SEP + "?\\s*(?:de\\s+)?" + MN, "i"), m => [m[1], monthNum(m[2]), 0]],
    // 2026-10-19 | 2026-10
    [new RegExp("(?<!\\d)(\\d{4})" + SEP + "(\\d{1,2})(?:" + SEP + "(\\d{1,2}))?(?!\\d)"), m => [m[1], m[2], m[3] || 0]],
    // 19-10-2026
    [new RegExp("(?<!\\d)(\\d{1,2})" + SEP + "(\\d{1,2})" + SEP + "(\\d{4})(?!\\d)"), m => [m[3], m[2], m[1]]],
    // 10-2026
    [new RegExp("(?<!\\d)(\\d{1,2})" + SEP + "(\\d{4})(?!\\d)"), m => [m[2], m[1], 0]]
  ];
  for (const [re, pick] of rules) {
    const m = base.match(re);
    if (!m) continue;
    const [y, mo, d] = pick(m).map(Number);
    if (mo < 1 || mo > 12 || d > 31) continue;
    const mes = MESES[mo - 1];
    const group = mes.charAt(0).toUpperCase() + mes.slice(1) + " " + y;
    const rest = (base.slice(0, m.index) + " " + base.slice(m.index + m[0].length))
      .replace(/[-\s]+/g, " ").replace(/^\s+|\s+$/g, "");
    const day = d ? d + " de " + mes : "";
    const sort = y + String(mo).padStart(2, "0") + String(d).padStart(2, "0");
    return { group, title: [day, rest].filter(Boolean).join(" – ") || group, sort };
  }
  return { group: "Otros", title: base.replace(/-+/g, " "), sort: "" };
}

async function loadDocs() {
  $("items").innerHTML = '<p style="color:var(--muted)">Cargando…</p>';
  try {
    const r = await fetch("https://api.github.com/repos/" + REPO + "/contents/");
    if (!r.ok) throw new Error(r.status);
    const files = await r.json();
    DOCS = files
      .filter(f => f.type === "file" && /\.pdf$/i.test(f.name))
      .map(f => Object.assign(parseName(f.name), { file: f.name }))
      .sort((x, y) => y.sort.localeCompare(x.sort) || x.file.localeCompare(y.file, "es", { numeric: true }));
  } catch (e) { DOCS = []; }
  let html = "", last = null;
  DOCS.forEach((d, i) => {
    if (d.group !== last) { html += `<h2>${esc(d.group)}</h2>`; last = d.group; }
    html += `<a class="item" href="#doc=${i}"><div><b>${esc(d.title)}</b></div><span>Abrir</span></a>`;
  });
  $("items").innerHTML = html || '<p style="color:var(--muted)">No se encontraron PDF. Sube alguno al repositorio y recarga.</p>';
}

pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

let flip = null, canvases = [], mode = "flip";

function destroyFlip() {
  if (flip) { try { flip.destroy(); } catch (e) {} flip = null; }
  $("bookWrap").innerHTML = '<div id="book"></div>';
}

function updateCount() {
  if (!flip) return;
  $("count").textContent = (flip.getCurrentPageIndex() + 1) + " / " + canvases.length;
}

function buildFlip() {
  destroyFlip();
  if (typeof St === "undefined" || !canvases.length) { mode = "scroll"; return; }
  const book = $("book");
  canvases.forEach((c, i) => {
    const div = document.createElement("div");
    div.className = "page";
    if (i === 0 || i === canvases.length - 1) div.setAttribute("data-density", "hard");
    const img = new Image();
    img.src = c.toDataURL("image/jpeg", 0.88);
    div.appendChild(img);
    book.appendChild(div);
  });
  const W = 500, H = Math.round(500 * canvases[0].height / canvases[0].width);
  flip = new St.PageFlip(book, {
    width: W, height: H, size: "stretch",
    minWidth: 200, maxWidth: 1000, minHeight: 280, maxHeight: 1500,
    showCover: true, usePortrait: true, mobileScrollSupport: false, maxShadowOpacity: 0.4
  });
  flip.loadFromHTML(book.querySelectorAll(".page"));
  flip.on("flip", updateCount);
  updateCount();
}

function showMode() {
  const flipOn = mode === "flip";
  $("bookWrap").style.display = flipOn ? "block" : "none";
  $("nav").style.display = flipOn ? "flex" : "none";
  $("pages").style.display = flipOn ? "none" : "block";
  $("mode").textContent = flipOn ? "Ver seguido" : "Hojear";
  if (flipOn && !flip) buildFlip();
  if (mode !== "flip") { $("bookWrap").style.display = "none"; $("nav").style.display = "none"; $("pages").style.display = "block"; $("mode").textContent = "Hojear"; }
}

async function openDoc(d) {
  $("list").style.display = "none";
  $("viewer").style.display = "block";
  $("pages").innerHTML = "";
  destroyFlip();
  canvases = [];
  mode = "flip";
  $("bookWrap").style.display = "none";
  $("nav").style.display = "none";
  $("pages").style.display = "none";
  $("msg").style.display = "block";
  $("msg").textContent = "Cargando…";
  $("dl").href = encodeURI(d.file);
  document.title = d.title;
  window.scrollTo(0, 0);
  try {
    const pdf = await pdfjsLib.getDocument(encodeURI(d.file)).promise;
    const scale = Math.min(2, (window.devicePixelRatio || 1) * 1.4);
    for (let n = 1; n <= pdf.numPages; n++) {
      $("msg").textContent = "Cargando página " + n + " de " + pdf.numPages + "…";
      const page = await pdf.getPage(n);
      const vp = page.getViewport({ scale });
      const c = document.createElement("canvas");
      c.width = vp.width; c.height = vp.height;
      await page.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
      $("pages").appendChild(c);
      canvases.push(c);
    }
    $("msg").style.display = "none";
    showMode();
  } catch (e) {
    $("msg").textContent = "No se pudo abrir el documento. Revisa que la ruta del archivo sea correcta.";
  }
}

$("mode").addEventListener("click", () => { mode = mode === "flip" ? "scroll" : "flip"; showMode(); });
$("prev").addEventListener("click", () => flip && flip.flipPrev());
$("next").addEventListener("click", () => flip && flip.flipNext());

function route() {
  const m = location.hash.match(/doc=(\d+)/);
  if (m && DOCS[m[1]]) { openDoc(DOCS[m[1]]); }
  else {
    destroyFlip();
    canvases = [];
    $("pages").innerHTML = "";
    $("viewer").style.display = "none";
    $("list").style.display = "block";
    document.title = "Mis documentos";
  }
}
window.addEventListener("hashchange", route);
$("back").addEventListener("click", e => { e.preventDefault(); location.hash = ""; });
loadDocs().then(route);
</script>
</body>
</html>
